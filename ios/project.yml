# Xcode project for the Pickup iPhone app, generated by XcodeGen (`xcodegen generate` in ios/).
# CI builds it on macOS runners (.github/workflows/ios.yml); TestFlight uploads use
# .github/workflows/ios-testflight.yml.
name: Pickup
options:
  bundleIdPrefix: ai.pickup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # The server the app talks to. Override per build: xcodebuild PICKUP_API_BASE_URL=...
    PICKUP_API_BASE_URL: "https://pickup-ai-i6v0t.fly.dev"
    # The app's bundle ID; the widget extension's is derived from it. Override: APP_BUNDLE_ID=...
    APP_BUNDLE_ID: ai.pickup.app
targets:
  Pickup:
    type: application
    platform: iOS
    sources:
      - path: Pickup
      - path: Shared
    dependencies:
      - target: PickupWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Pickup/Pickup.entitlements
    info:
      path: Pickup/Info.plist
      properties:
        CFBundleDisplayName: Pickup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        PickupAPIBaseURL: $(PICKUP_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.pickup.app
            CFBundleURLSchemes: [pickup]
  PickupWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PickupWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    info:
      path: PickupWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pickup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PickupTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PickupTests]
    dependencies:
      - target: Pickup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PickupUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PickupUITests]
    dependencies:
      - target: Pickup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pickup
schemes:
  Pickup:
    build:
      targets:
        Pickup: all
    test:
      config: Debug
      targets: [PickupTests, PickupUITests]
    archive:
      config: Release
