name: Agent evals

# Run by hand (Actions tab > Agent evals > Run workflow) after adding the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenario ids separated by spaces (blank = all)"
        required: false
        default: ""

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install .
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.run_evals -v ${{ github.event.inputs.scenarios }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: backend/evals/last_run.json
