name: iOS screenshots

# Runs the iPhone app on the simulator against a local test server filled with demo calls
# (backend/scripts/seed_demo.py), walks through the main screens
# (ios/PickupUITests/ScreenshotTour.swift) and publishes the pictures to the
# "screenshots-ios" branch. Uses no real accounts or keys.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Start a local test server with demo data
        working-directory: backend
        env:
          ENV: dev
          DATABASE_URL: sqlite+aiosqlite:///./demo.db
        run: |
          pip install . >/dev/null
          python -m scripts.seed_demo --phone +919800000002 --pool +918047491800 +918047491801
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:8000/v1/config
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' in runtime:
                  phones = [d for d in devices[runtime] if d['name'].startswith('iPhone')]
                  if phones:
                      print(phones[0]['udid']); break
          ")
          echo "SIM=$UDID" >> "$GITHUB_ENV"
      - name: Run the tour
        working-directory: ios
        env:
          TEST_RUNNER_PICKUP_API_BASE_URL: http://localhost:8000
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/out/screens
        run: |
          mkdir -p ../out/screens
          xcodebuild test -project Pickup.xcodeproj -scheme Pickup -destination "id=$SIM" \
            -only-testing:PickupUITests CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tail -60 | tee ../out/tour.txt || true
          ls -la ../out/screens
      - name: Publish to the screenshots-ios branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p out && cp server.log out/ 2>/dev/null || true
          cd out
          git init -q -b screenshots-ios
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "iOS screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots-ios
