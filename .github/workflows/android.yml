name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit-test
        # Set the repository variable PICKUP_API_BASE_URL (Settings > Secrets and variables > Actions >
        # Variables) to your server, e.g. https://pickup-yourname.fly.dev, so the APK talks to it.
        run: ./gradlew --no-configuration-cache assembleDebug testDebugUnitTest -Ppickup.apiBaseUrl=${{ vars.PICKUP_API_BASE_URL || 'http://10.0.2.2:8000' }}
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pickup-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
