name: Android

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit-test
        # The APK talks to pickup.apiBaseUrl from android/gradle.properties (the Fly.io server).
        # The PICKUP_API_BASE_URL repository variable overrides it.
        run: ./gradlew --no-configuration-cache assembleDebug assembleRelease testDebugUnitTest ${{ vars.PICKUP_API_BASE_URL && format('-Ppickup.apiBaseUrl={0}', vars.PICKUP_API_BASE_URL) || '' }}
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pickup-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pickup-release-apk
          path: android/app/build/outputs/apk/release/*.apk

  release-smoke:
    # Code shrinking (R8) can break a release build at runtime. Install a release build on an
    # emulator and sign in against a local test server before anything is published.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Start a local test server
        working-directory: backend
        env:
          ENV: dev
          DATABASE_URL: sqlite+aiosqlite:///./smoke.db
          PYTHONUNBUFFERED: "1"
        run: |
          pip install . >/dev/null
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break; sleep 2; done
      - name: Build a release APK pointed at the test server
        working-directory: android
        run: ./gradlew --no-configuration-cache assembleRelease -Ppickup.apiBaseUrl=http://10.0.2.2:8000
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sign in with the release build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p out
            adb install -r -g android/app/build/outputs/apk/release/app-release.apk
            python3 .github/scripts/release_smoke.py

  publish:
    # Puts each release APK built from main on the server, so testers download it from
    # https://<app>.fly.dev (no GitHub account needed). Skipped until FLY_API_TOKEN exists.
    needs: [build, release-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish-apk
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        id: setup
        env:
          RAW_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP_VAR: ${{ vars.FLY_APP_NAME }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]*(FlyV1)?[[:space:]]*/FlyV1 /')
          echo "::add-mask::$token"
          echo "FLY_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "APP=${APP_VAR:-$(sed -nE 's/^app *= *"([^"]+)".*/\1/p' backend/fly.toml)}" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          name: pickup-release-apk
          path: apk
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.setup.outputs.ready == 'true'
      - name: Upload the APK to the server
        if: steps.setup.outputs.ready == 'true'
        run: |
          admin=$(flyctl ssh console --app "$APP" -C "printenv ADMIN_TOKEN" 2>/dev/null | tr -d '\r' | grep -v '^$' | tail -n1)
          [ -n "$admin" ] || { echo "::error::Couldn't read the server's admin token. Is the server deployed?"; exit 1; }
          echo "::add-mask::$admin"
          version="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)-${GITHUB_RUN_NUMBER}"
          curl -fsS -X PUT "https://$APP.fly.dev/admin/apk?version=$version" -H "X-Admin-Token: $admin" \
            -H "Content-Type: application/vnd.android.package-archive" --data-binary @apk/app-release.apk
          echo
          echo "Published version $version: https://$APP.fly.dev/download/android"
