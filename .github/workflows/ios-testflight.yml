name: iOS TestFlight

# Builds, signs and uploads the iPhone app to TestFlight, so testers install it from a link,
# without an App Store listing. Needs an Apple Developer account and these secrets
# (docs/guides/IPHONE.md): APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY.
# Signing is automatic: Xcode creates the certificate and profile with the API key.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || vars.IOS_BUNDLE_ID || 'ai.pickup.app' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        env:
          KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing ASC_PRIVATE_KEY"
          if [ -n "$missing" ]; then echo "::error::Add these GitHub secrets first:$missing (see docs/guides/IPHONE.md)"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive -project Pickup.xcodeproj -scheme Pickup -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Pickup.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" APP_BUNDLE_ID="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" -quiet 2>&1 | tail -60
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Pickup.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -40
          echo "Uploaded build $GITHUB_RUN_NUMBER. It appears in App Store Connect › TestFlight after Apple processes it (10-30 minutes)."
