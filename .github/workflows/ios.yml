name: iOS

# Builds the iPhone app for the simulator and runs its unit tests. macOS runners cost 10x
# minutes on private repositories, so this runs only when ios/ changes (or by hand).
on:
  workflow_dispatch:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen >/dev/null
          xcodebuild -version
          xcodegen generate
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' in runtime:
                  phones = [d for d in devices[runtime] if d['name'].startswith('iPhone')]
                  if phones:
                      print(phones[0]['udid']); break
          ")
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build and run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project Pickup.xcodeproj -scheme Pickup -destination "id=$SIM" \
            -only-testing:PickupTests CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tail -80
