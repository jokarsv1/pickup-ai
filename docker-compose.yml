# Local development stack: Postgres, Redis and the backend.
#   cp backend/.env.example backend/.env   # then fill in keys
#   docker compose up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup
      POSTGRES_DB: pickup
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pickup:pickup@db:5432/pickup
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [recordings:/app/recordings]
volumes:
  pgdata: {}
  recordings: {}
