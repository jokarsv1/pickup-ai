# Fly.io config for the Pickup backend, deployed by .github/workflows/deploy.yml.
# The server lives at https://pickup-ai-i6v0t.fly.dev. If you rename the app, change pickup.apiBaseUrl in
# android/gradle.properties too (or set the FLY_APP_NAME and PICKUP_API_BASE_URL variables).
app = "pickup-ai-i6v0t"
primary_region = "bom"  # Mumbai: close to Indian callers and Exotel's media servers

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "prod"
  DATABASE_URL = "sqlite+aiosqlite:////data/pickup.db"
  RECORDINGS_DIR = "/data/recordings"

[http_service]
  internal_port = 8000
  force_https = true
  # Phone calls can't wait for a machine to wake up, so keep one running at all times.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "pickup_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
